name: OSV-Scanner Scheduled Scan

# 結果は Security タブの Code scanning に上げ，書き込み権限のある人だけが見られるようにする．
# Public リポジトリなので，脆弱性の一覧を Issue や Actions のログには出さない（2026-11-04）．
# 新しく公開された脆弱性では run を赤にしない．赤にするのはスキャナ自体が失敗したときだけ．
# Code scanning は新しい alert をメールで知らせないので，気づくのは Dependabot alerts のメールに任せる．

on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64
          # 配布バイナリの改ざん検知のため，公式 SHA256SUMS の値と照合する
          echo "bb30c580afe5e757d3e959f4afd08a4795ea505ef84c46962b9a738aa573b41b  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
      - name: Scan dependencies
        run: |
          # 終了コード 0 は脆弱性なし，1 は脆弱性あり
          code=0
          /tmp/osv-scanner scan source -r --format sarif --output-file "$RUNNER_TEMP/osv.sarif" . || code=$?
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/osv.sarif
          category: osv-scanner
