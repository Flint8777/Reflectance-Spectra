name: PR Build Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.js'
      - '.github/workflows/pr-build-check.yml'

# PR と依存のコードを走らせるビルドのジョブには読み取りの token だけを渡す。
# PR へのコメントは、checkout もビルドもしない comment ジョブだけが書き込み権限を持つ
permissions:
  contents: read

jobs:
  build-check-windows:
    name: Windows Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (verify only)
        run: pnpm run build

  build-check-macos:
    name: macOS Build Check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # release.yml と同じ universal パックまで通す。x64/arm64 の .app 結合はここでしか事前に検証できない
      - name: Build (verify only, universal .app)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build && pnpm exec electron-builder --mac --universal --dir --publish never

      - name: Assert the app bundle is universal
        run: |
          app=$(find dist-electron -path "*/mac-universal/*.app" -type d | head -n1)
          if [ -z "$app" ]; then echo "::error::universal .app was not built"; exit 1; fi
          archs=$(lipo -archs "$app/Contents/MacOS/Reflectance Spectra Viewer")
          echo "archs: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) echo "ok: universal" ;;
            *) echo "::error::expected x86_64 + arm64, got: $archs"; exit 1 ;;
          esac

  comment:
    name: Comment on PR
    needs: [build-check-windows, build-check-macos]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment build results
        uses: actions/github-script@v9
        env:
          WINDOWS_RESULT: ${{ needs.build-check-windows.result }}
          MACOS_RESULT: ${{ needs.build-check-macos.result }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // 以前と同じく、成功と失敗のときだけ OS ごとに 1 件ずつ書く（キャンセル・スキップでは書かない）
            const results = [
              ['Windows', process.env.WINDOWS_RESULT],
              ['macOS', process.env.MACOS_RESULT],
            ];
            for (const [os, result] of results) {
              let body;
              if (result === 'success') body = `✅ ${os} build check passed`;
              else if (result === 'failure') body = `❌ ${os} build check failed — [ログを確認](${runUrl})`;
              else continue;
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
