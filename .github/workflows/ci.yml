name: CI

on:
  push:
    branches: [ main, 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-web:
    name: Build Vite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist

  build-electron-windows:
    name: Build Electron (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (no publish)
        run: pnpm run electron:build:win -- --publish=never

      - name: Rename portable zip
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "dist-electron" -Filter "*.zip" -File
          foreach ($f in $files) {
            $m = ($f.Name | Select-String -Pattern "-v([0-9.]+)-windows-portable\.zip")
            if ($m) {
              $version = $m.Matches[0].Groups[1].Value
              $newName = "Reflectance-Spectra-Viewer-v$version`_win.zip"
              Rename-Item -Path $f.FullName -NewName $newName
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-win
          path: dist-electron
