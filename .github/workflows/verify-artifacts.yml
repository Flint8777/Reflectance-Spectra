name: Verify Build Artifacts

on:
  workflow_run:
    workflows: ["Release builds (Windows & macOS)"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  verify-windows:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-portable-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract and verify
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { Write-Host "❌ ZIP file not found"; exit 1 }
          Write-Host "Found: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath "extracted"
          $exe = Get-ChildItem -Path "extracted" -Recurse -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Host "❌ Executable not found"; exit 1 }
          Write-Host "Executable found: $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden
          # 最大30秒ポーリングして起動確認
          $started = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if (-not $proc.HasExited) { $started = $true; break }
          }
          if ($started) {
            Write-Host "✅ App started successfully"
            Stop-Process -Id $proc.Id -Force
          } else {
            Write-Host "❌ App crashed immediately"
            exit 1
          }

  # Universal DMG なので Apple Silicon と Intel の両方で実際に起動するか確かめる
  verify-macos:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: mac-dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Mount DMG and verify
        run: |
          echo "runner arch: $(uname -m)"
          dmg=$(find . -name "*.dmg" -type f | head -n1)
          if [ -z "$dmg" ]; then echo "❌ DMG file not found"; exit 1; fi
          echo "Found: $dmg"
          hdiutil attach "$dmg" -mountpoint /tmp/dmg-verify -nobrowse
          app=$(find /tmp/dmg-verify -name "*.app" -type d | head -n1)
          if [ -z "$app" ]; then echo "❌ .app bundle not found"; hdiutil detach /tmp/dmg-verify; exit 1; fi
          echo "App found: $app"
          echo "archs: $(lipo -archs "$app/Contents/MacOS/Reflectance Spectra Viewer")"
          open "$app"
          # 最大30秒ポーリングして起動確認
          for i in $(seq 1 30); do
            sleep 1
            if pgrep -f "Reflectance Spectra Viewer" > /dev/null 2>&1; then
              echo "✅ App started successfully (${i}s)"
              pkill -f "Reflectance Spectra Viewer" 2>/dev/null || true
              hdiutil detach /tmp/dmg-verify 2>/dev/null || true
              exit 0
            fi
          done
          hdiutil detach /tmp/dmg-verify 2>/dev/null || true
          echo "❌ App failed to start within 30 seconds"
          exit 1
