name: Release builds (Windows & macOS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CLEAN="${TAG#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${CLEAN}';fs.writeFileSync('./package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app (no publish)
        run: pnpm run build && pnpm exec electron-builder --win --publish never

      - name: Pack portable ZIP
        run: pnpm run pack:zip

      - name: Rename portable zip
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "dist-electron" -Filter "*.zip" -File
          foreach ($f in $files) {
            $m = ($f.Name | Select-String -Pattern "-v([0-9.]+)-windows-portable\.zip")
            if ($m) {
              $version = $m.Matches[0].Groups[1].Value
              $newName = "Reflectance-Spectra-Viewer-v$version`_win.zip"
              Rename-Item -Path $f.FullName -NewName $newName
            }
          }

      - name: Assert update metadata was generated
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-electron/latest.yml")) {
            throw "latest.yml was not generated - electron-updater cannot work without it"
          }
          $setup = Get-ChildItem -Path "dist-electron" -Filter "*_win_setup.exe" -File
          if (-not $setup) { throw "installer was not built" }
          # latest.yml の url とアセット名がずれると更新が 404 になる
          $m = Select-String -Path "dist-electron/latest.yml" -Pattern 'url:\s*(\S+)' | Select-Object -First 1
          $url = $m.Matches[0].Groups[1].Value
          if ($url -ne $setup.Name) {
            throw "latest.yml url ($url) does not match the built installer ($($setup.Name))"
          }
          Write-Host "ok: $($setup.Name) / latest.yml"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-dist
          path: dist-electron

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-electron/Reflectance-Spectra-Viewer-v*_win.zip
            dist-electron/Reflectance-Spectra-Viewer-v*_win_setup.exe
            dist-electron/Reflectance-Spectra-Viewer-v*_win_setup.exe.blockmap
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    name: Build macOS (x64) dmg/zip
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CLEAN="${TAG#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${CLEAN}';fs.writeFileSync('./package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app x64 (cross-compile on arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build && pnpm exec electron-builder --mac --x64 --publish never

      - name: Ad-hoc codesign and re-create x64 DMG
        run: |
          app=$(find dist-electron -path "*/mac*/*.app" -type d | head -n1)
          codesign --force --deep --sign - "$app"
          echo "Signed: $app"
          rm -f dist-electron/*.dmg
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          VERSION=$(node -p 'require("./package.json").version')
          hdiutil create \
            -volname "Reflectance Spectra Viewer" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "dist-electron/Reflectance Spectra Viewer-${VERSION}-x64.dmg"
          rm -rf "$staging"

      - name: Rename macOS x64 DMG
        run: |
          mkdir -p dist-electron/renamed
          for f in dist-electron/*.dmg; do
            base="${f##*/}"
            version=$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            [ -n "$version" ] && mv "$f" "dist-electron/renamed/Reflectance.Spectra.Viewer-${version}_mac_x64.dmg"
          done

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-x64-dist
          path: dist-electron/renamed

      - name: Attach macOS x64 DMG to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-electron/renamed/Reflectance.Spectra.Viewer-*_mac_x64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    name: Build macOS (arm64) dmg/zip
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CLEAN="${TAG#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${CLEAN}';fs.writeFileSync('./package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build && pnpm exec electron-builder --mac --publish never

      - name: Ad-hoc codesign and re-create arm64 DMG
        run: |
          app=$(find dist-electron -path "*/mac*/*.app" -type d | head -n1)
          codesign --force --deep --sign - "$app"
          echo "Signed: $app"
          rm -f dist-electron/*.dmg
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          VERSION=$(node -p 'require("./package.json").version')
          hdiutil create \
            -volname "Reflectance Spectra Viewer" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "dist-electron/Reflectance Spectra Viewer-${VERSION}-arm64.dmg"
          rm -rf "$staging"

      - name: Rename macOS arm64 DMG
        run: |
          mkdir -p dist-electron/renamed
          for f in dist-electron/*.dmg; do
            base="${f##*/}"
            version=$(echo "$base" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            [ -n "$version" ] && mv "$f" "dist-electron/renamed/Reflectance.Spectra.Viewer-${version}_mac_arm64.dmg"
          done

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-arm64-dist
          path: dist-electron/renamed

      - name: Attach macOS arm64 DMG to Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-electron/renamed/Reflectance.Spectra.Viewer-*_mac_arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build web (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CLEAN="${TAG#v}"
          node -e "const fs=require('fs');const p=require('./package.json');p.version='${CLEAN}';fs.writeFileSync('./package.json',JSON.stringify(p,null,2));"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Zip web dist with version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"; CLEAN="${TAG#v}"
          zip -qry "web-dist-v${CLEAN}.zip" dist

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web-dist-v*.zip

      - name: Attach web dist to Release
        uses: softprops/action-gh-release@v3
        with:
          files: web-dist-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-x64, build-macos-arm64, build-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate and update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"

          # 前回のタグを取得
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')

          # GitHub API でchangelogを自動生成
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body')
          else
            CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" \
              --jq '.body')
          fi

          # ダウンロードセクションを付加
          cat > release_notes.md <<EOF
          ${CHANGELOG}

          ---

          ## ダウンロード

          ### Windows

          - \`Reflectance-Spectra-Viewer-${TAG}_win_setup.exe\`（推奨） — 実行するとインストールされ、以降はアプリ内の更新ボタンで自動更新されます。以前の portable 版を使っていた場合は自動で片付けられます（タスクバーにピン留めしていた場合は貼り直してください）
          - \`Reflectance-Spectra-Viewer-${TAG}_win.zip\` — 解凍して \`Reflectance Spectra Viewer.exe\` を実行する従来版

          ### macOS

          **Intel Mac**
          - \`Reflectance.Spectra.Viewer-${VER}_mac_x64.dmg\`

          **Apple Silicon**
          - \`Reflectance.Spectra.Viewer-${VER}_mac_arm64.dmg\`

          > **初回起動時の注意**（「開発元が未確認」の警告が出る場合）: アプリを右クリック →「開く」→ 警告ダイアログで再度「開く」

          ### Web版
          - \`web-dist-${TAG}.zip\` — ブラウザで動作するWeb版（解凍して \`index.html\` を開く）

          ---
          EOF

          # インデントを除去
          sed -i 's/^          //' release_notes.md

          gh release edit "$TAG" --notes-file release_notes.md --title "Release ${TAG}"

  verify-release-assets:
    name: Verify release assets
    runs-on: ubuntu-latest
    needs: [release-notes]
    steps:
      # 過去に v2.1.3 / v2.1.5 / v2.1.6 がアセット 0 個で公開され、
      # 利用者が更新できないまま取り残された。ここで落とせば気づける。
      - name: Assert the release has the assets users need
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "attached assets:"
          echo "$names" | sed 's/^/  - /'

          fail=0
          # アプリ内アップデータが探すのはこの 1 個だけ（main.cjs の判定と同じ条件）。
          # 複数あると .find() が先頭を掴むので、ちょうど 1 個であることまで確かめる。
          win=$(echo "$names" | grep -Eic '(_win|windows-portable).*\.zip$' || true)
          if [ "$win" -ne 1 ]; then
            echo "::error::Windows ZIP for the in-app updater: expected exactly 1, found $win"
            fail=1
          fi
          # インストーラ版の自動更新は latest.yml の url とアセット名の一致に依存する
          yml=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'latest.yml' --output - 2>/dev/null || true)
          if [ -z "$yml" ]; then
            echo "::error::latest.yml is not attached - installer builds cannot update"
            fail=1
          else
            url=$(echo "$yml" | sed -n 's/^[[:space:]]*-\{0,1\}[[:space:]]*url:[[:space:]]*//p' | head -1 | tr -d '\r')
            if ! echo "$names" | grep -Fxq "$url"; then
              echo "::error::latest.yml points at '$url' which is not attached to the release"
              fail=1
            fi
          fi
          for pattern in '_win_setup\.exe$' '_win_setup\.exe\.blockmap$' '_mac_x64\.dmg$' '_mac_arm64\.dmg$' '^web-dist-.*\.zip$'; do
            n=$(echo "$names" | grep -Eic "$pattern" || true)
            if [ "$n" -lt 1 ]; then
              echo "::error::missing asset matching /$pattern/"
              fail=1
            fi
          done
          exit $fail
